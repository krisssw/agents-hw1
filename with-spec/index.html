<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Мини-трекер учебных задач</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="app">
    <header class="app__header">
      <div class="app__heading">
        <h1>Учебные задачи <span class="accent-word">на неделю</span></h1>
        <p class="app__subtitle">Планируйте часы, отмечайте выполненное и следите за прогрессом.</p>
      </div>
      <div class="settings">
        <button id="settings-toggle" class="icon-btn" type="button" aria-label="Настройки"
                aria-expanded="false" aria-controls="settings-panel">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/>
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.96 4.54 1.7 1.7 0 0 0 10 2.98V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.46 9c.26.6.85 1 1.51 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
          </svg>
        </button>

        <section id="settings-panel" class="panel" role="dialog" aria-modal="false"
                 aria-labelledby="settings-title" hidden>
          <div class="panel__head">
            <h2 id="settings-title">Настройки</h2>
            <button id="settings-close" class="pill pill--ghost" type="button">Закрыть</button>
          </div>

          <fieldset class="group">
            <legend>Тема</legend>
            <div class="pills" id="theme-options">
              <label class="pill-option"><input type="radio" name="theme" value="dark"><span>Тёмная</span></label>
              <label class="pill-option"><input type="radio" name="theme" value="light"><span>Светлая</span></label>
              <label class="pill-option"><input type="radio" name="theme" value="system"><span>Системная</span></label>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>Цвет выделения</legend>
            <div class="swatches" id="accent-presets">
              <label class="swatch" style="--sw: hsl(320 35% 68%)"><input type="radio" name="accent-preset" value="lilac" aria-label="Сиреневый"><span aria-hidden="true"></span></label>
              <label class="swatch" style="--sw: hsl(217 85% 62%)"><input type="radio" name="accent-preset" value="blue" aria-label="Синий"><span aria-hidden="true"></span></label>
              <label class="swatch" style="--sw: hsl(158 60% 48%)"><input type="radio" name="accent-preset" value="emerald" aria-label="Изумрудный"><span aria-hidden="true"></span></label>
              <label class="swatch" style="--sw: hsl(38 92% 56%)"><input type="radio" name="accent-preset" value="amber" aria-label="Янтарный"><span aria-hidden="true"></span></label>
              <label class="swatch" style="--sw: hsl(8 80% 64%)"><input type="radio" name="accent-preset" value="coral" aria-label="Коралловый"><span aria-hidden="true"></span></label>
            </div>
          </fieldset>

          <fieldset class="group custom-color">
            <legend>Свой цвет</legend>
            <div class="slider">
              <div class="slider__row">
                <label for="accent-h">Оттенок</label>
                <output id="accent-h-value" for="accent-h">320</output>
              </div>
              <input id="accent-h" class="range range--hue" type="range" min="0" max="360" step="1" value="320">
            </div>
            <div class="slider">
              <div class="slider__row">
                <label for="accent-s">Насыщенность</label>
                <output id="accent-s-value" for="accent-s">35%</output>
              </div>
              <input id="accent-s" class="range range--sat" type="range" min="0" max="100" step="1" value="35">
            </div>
            <div class="slider">
              <div class="slider__row">
                <label for="accent-l">Яркость</label>
                <output id="accent-l-value" for="accent-l">68%</output>
              </div>
              <input id="accent-l" class="range range--light" type="range" min="20" max="80" step="1" value="68">
            </div>
            <div class="sample">
              <span id="accent-sample" class="sample__swatch" role="img" aria-label="Образец выбранного цвета"></span>
              <span id="accent-sample-text" class="sample__text">hsl(320 35% 68%)</span>
            </div>
          </fieldset>
        </section>
      </div>
    </header>

    <p id="storage-message" class="notice" role="status" hidden></p>

    <div class="dashboard">
      <div class="dashboard__side">
        <section class="card summary" aria-labelledby="summary-title">
          <h2 id="summary-title">Итоги</h2>
          <dl class="summary__grid">
            <div class="tile">
              <dt>Всего</dt>
              <dd><span id="total-hours" class="tile__num">0</span> <span class="tile__unit">ч</span></dd>
            </div>
            <div class="tile">
              <dt>Выполнено</dt>
              <dd><span id="done-hours" class="tile__num">0</span> <span class="tile__unit">ч</span></dd>
            </div>
            <div class="tile">
              <dt>Прогресс</dt>
              <dd><span id="progress-value" class="tile__num">0</span><span class="tile__unit">%</span></dd>
            </div>
          </dl>
          <label class="progress-label" for="progress-bar">Прогресс по часам</label>
          <progress id="progress-bar" max="100" value="0">0%</progress>
        </section>

        <section class="card add" aria-labelledby="add-title">
          <h2 id="add-title">Новая задача</h2>
          <form id="task-form" class="form" novalidate>
            <div class="field">
              <label for="task-title">Название</label>
              <input id="task-title" name="title" type="text" autocomplete="off"
                     enterkeyhint="next" aria-describedby="task-title-error">
              <p id="task-title-error" class="field__error" aria-live="polite" hidden></p>
            </div>
            <div class="field">
              <label for="task-hours">Часы (0,5–24, шаг 0,5)</label>
              <input id="task-hours" name="hours" type="text" inputmode="decimal"
                     autocomplete="off" enterkeyhint="done" aria-describedby="task-hours-error">
              <p id="task-hours-error" class="field__error" aria-live="polite" hidden></p>
            </div>
            <button id="task-add" type="button" class="btn btn--primary">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/>
              </svg>
              <span>Добавить</span>
            </button>
          </form>
        </section>
      </div>

      <section class="card list" aria-labelledby="list-title">
        <div class="list__head">
          <h2 id="list-title">Задачи</h2>
          <fieldset class="filter" id="task-filter">
            <legend class="visually-hidden">Показать</legend>
            <div class="pills">
              <label class="pill-option"><input type="radio" name="filter" value="all" checked><span>Все</span></label>
              <label class="pill-option"><input type="radio" name="filter" value="active"><span>Активные</span></label>
              <label class="pill-option"><input type="radio" name="filter" value="done"><span>Выполненные</span></label>
            </div>
          </fieldset>
        </div>
        <ul id="task-list" class="tasks"></ul>
        <p id="empty-message" class="empty" hidden></p>
      </section>
    </div>
  </main>

  <script src="tracker.js" defer></script>
</body>
</html>
